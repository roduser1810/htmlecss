<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
  
        }
        body{
            background-color: rgb(215, 189, 154);
        }
        h1{
            color: rgb(67, 57, 44);
            margin-bottom: 80px;
            font-size: 50px;
            text-align: center;
            
        }
        input{
            border: 2px solid black;
            padding: 10px;
            border-radius: 20px;
            width: 300px;
        
           
        }
        
       
        p#nome1{
        text-align: center;    
        margin-bottom: 25px;     
        margin-right: 60px;
          
        }
        input#enviar{
            background-color: rgb(0, 64, 255);
            width: 150px;
            color: rgb(255, 255, 255);
            font-weight: bold;
            font-size: 15px;
            
        }
        input#enviar:hover{
            background-color: rgb(3, 3, 126);
            color: rgb(255, 255, 255);
            transition: 0.4s;
        }
        p#enviar1{
            text-align: center;
        }
        p#sobrenome{
            margin-right: 100px;
            text-align: center;
        }

    </style>
</head>
<body> 
    <h1>CADASTRO</h1>
    <form >
        <p id="nome1" >Nome : <input type="text" name="nome1" id="nome1"></p>
        <p id="sobrenome">Sobrenome : <input type="text" name="sobrenome" id="sobrenome"></p>
        <p id="enviar1"><input type="submit" value="Enviar" id="enviar"></p>
    </form>
</body>
</html>
