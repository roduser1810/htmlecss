<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" value="mas" id="isxmas" required ><label for="isxmas">Masculunino</label> <br>
            <input type="radio" name="sexo" id="isxfem"  value="fem" required><label for="isxfem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="esfut" id="iesfut" > <label for="iesfut">Futebol</label><br>
            <input type="checkbox" name="nat" id="inat" > <label for="inat">Nataçao</label> <br>
            <input type="checkbox" name="vol" id="ivol"> <label for="ivol">Volei</label> <br>
            <input type="checkbox" name="bas" id="ibas"> <label for="ibas">Basquete</label> <br>
        </fieldset>
        <!-- usar o placehouder para colocar uma frase de ajuda -->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>













    </form>
</body>
</html>
