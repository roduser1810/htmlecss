<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>LINKS</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
            a{
                color: rgb(197, 28, 28);
                text-decoration: none;
                font-weight: bold;
            }
            a:visited{
                color: rgb(182, 17, 17);

            }
            a:hover{
                text-decoration: underline;
                color: black;
            }
            a:active{
                color: rgb(209, 24, 24);
            }
            .especial{
                background-color: rgb(214, 204, 203);
            }
            .especial::before{
                content: '	⇒';
                 text-decoration: none;
                font-weight: normal;
                color: rgb(121, 69, 69);
             }
           .especial::after{

                content: " ⇐";
                text-decoration: none;
                font-weight: normal;
                color: rgb(121, 69, 69);
            }


    </style>
     
</head>
<body>
    <ul>
